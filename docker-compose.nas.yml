services:
  docmost:
    image: docmost:community-edition
    depends_on:
      - db
      - redis
    environment:
      APP_URL: 'http://192.168.31.205:3000'
      APP_SECRET: '4a00d6da92be3c4dae4865f196e6890dcb54fa88d2630d7254f8077428f77548'
      DATABASE_URL: 'postgresql://docmost:Docmost2026Db!@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: Docmost2026Db!
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker-init/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
